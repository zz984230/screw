<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hi就业 - 招聘App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: {
                            900: '#0a0a0f',
                            800: '#12121a',
                            700: '#1a1a25',
                            600: '#252535',
                        },
                        accent: {
                            blue: '#3b82f6',
                            purple: '#8b5cf6',
                            cyan: '#06b6d4',
                        }
                    },
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', 'SF Pro Display', 'Segoe UI', 'Roboto', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
        }
        
        /* 毛玻璃效果增强 */
        .glass {
            background: rgba(26, 26, 37, 0.7);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
        }
        
        .glass-light {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
        }
        
        .glass-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.03) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        
        /* 菱形按钮 */
        .diamond-btn {
            transform: rotate(45deg);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .diamond-btn:hover {
            transform: rotate(45deg) scale(1.05);
        }
        
        .diamond-btn:active {
            transform: rotate(45deg) scale(0.95);
        }
        
        .diamond-content {
            transform: rotate(-45deg);
        }
        
        /* 渐变背景动画 */
        .gradient-bg {
            background: linear-gradient(135deg, #0a0a0f 0%, #12121a 50%, #1a1a25 100%);
        }
        
        .gradient-mesh {
            background: 
                radial-gradient(ellipse at 20% 20%, rgba(59, 130, 246, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(139, 92, 246, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(6, 182, 212, 0.04) 0%, transparent 50%);
        }
        
        /* 选中标签页渐变 */
        .tab-active {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.9) 0%, rgba(139, 92, 246, 0.9) 100%);
        }
        
        /* 卡片悬停效果 */
        .hover-lift {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .hover-lift:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        
        /* 微妙发光边框 */
        .glow-border {
            position: relative;
        }
        
        .glow-border::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }
        
        /* 滚动条隐藏 */
        ::-webkit-scrollbar {
            display: none;
        }
        
        /* iOS 安全区域适配 */
        .safe-top {
            padding-top: env(safe-area-inset-top, 0px);
        }
        
        .safe-bottom {
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }
    </style>
</head>
<body class="gradient-bg text-white min-h-screen overflow-x-hidden">
    <!-- 渐变网格背景 -->
    <div class="fixed inset-0 gradient-mesh pointer-events-none"></div>
    
    <!-- 主容器 - 移动端优先，最大宽度 430px -->
    <div class="relative max-w-[430px] mx-auto min-h-screen flex flex-col">
        
        <!-- 状态栏占位 -->
        <div class="h-12 safe-top"></div>
        
        <!-- 顶部区域：品牌 + 标签页 -->
        <header class="px-5 py-4 flex items-center justify-between">
            <!-- 品牌标题 -->
            <h1 class="text-2xl font-bold tracking-tight">
                <span class="bg-gradient-to-r from-white via-white to-gray-400 bg-clip-text text-transparent">Hi就业</span>
            </h1>
            
            <!-- 标签页切换 -->
            <div class="glass rounded-full p-1 flex items-center gap-0.5">
                <button class="tab-active px-4 py-1.5 rounded-full text-sm font-medium text-white shadow-lg shadow-blue-500/20">
                    招聘
                </button>
                <button class="px-4 py-1.5 rounded-full text-sm font-medium text-white/60 hover:text-white/90 transition-colors">
                    用工
                </button>
            </div>
        </header>
        
        <!-- 中间横向导航栏（胶囊按钮） -->
        <nav class="px-4 py-3">
            <div class="glass rounded-full px-2 py-2 flex items-center justify-between overflow-x-auto">
                <button class="flex-shrink-0 px-4 py-2 rounded-full bg-white text-dark-900 text-sm font-semibold shadow-lg">
                    招聘
                </button>
                <button class="flex-shrink-0 px-4 py-2 rounded-full text-white/70 hover:text-white text-sm font-medium hover:bg-white/5 transition-all">
                    考试
                </button>
                <button class="flex-shrink-0 px-4 py-2 rounded-full text-white/70 hover:text-white text-sm font-medium hover:bg-white/5 transition-all">
                    猎头
                </button>
                <button class="flex-shrink-0 px-4 py-2 rounded-full text-white/70 hover:text-white text-sm font-medium hover:bg-white/5 transition-all">
                    背调
                </button>
                <button class="flex-shrink-0 px-4 py-2 rounded-full text-white/70 hover:text-white text-sm font-medium hover:bg-white/5 transition-all">
                    测评
                </button>
            </div>
        </nav>
        
        <!-- 三栏布局区域 -->
        <main class="flex-1 px-3 py-4">
            <div class="flex gap-2 items-stretch">
                
                <!-- 左侧：菱形按钮 -->
                <div class="w-[70px] flex flex-col items-center gap-3 py-2">
                    <!-- 社会招聘 -->
                    <div class="flex flex-col items-center gap-1.5">
                        <button class="diamond-btn w-14 h-14 glass-card rounded-xl flex items-center justify-center glow-border hover-lift">
                            <div class="diamond-content flex flex-col items-center">
                                <svg class="w-5 h-5 text-white/90" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                                </svg>
                            </div>
                        </button>
                        <span class="text-[10px] text-white/70 font-medium">社会招聘</span>
                    </div>
                    
                    <!-- 本市校招 -->
                    <div class="flex flex-col items-center gap-1.5">
                        <button class="diamond-btn w-14 h-14 glass-card rounded-xl flex items-center justify-center glow-border hover-lift">
                            <div class="diamond-content flex flex-col items-center">
                                <svg class="w-5 h-5 text-white/90" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
                                </svg>
                            </div>
                        </button>
                        <span class="text-[10px] text-white/70 font-medium">本市校招</span>
                    </div>
                    
                    <!-- 省内校招 -->
                    <div class="flex flex-col items-center gap-1.5">
                        <button class="diamond-btn w-14 h-14 glass-card rounded-xl flex items-center justify-center glow-border hover-lift">
                            <div class="diamond-content flex flex-col items-center">
                                <svg class="w-5 h-5 text-white/90" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                                </svg>
                            </div>
                        </button>
                        <span class="text-[10px] text-white/70 font-medium">省内校招</span>
                    </div>
                    
                    <!-- X就业 -->
                    <div class="flex flex-col items-center gap-1.5">
                        <button class="diamond-btn w-14 h-14 glass-card rounded-xl flex items-center justify-center glow-border hover-lift relative overflow-hidden">
                            <div class="absolute inset-0 bg-gradient-to-br from-accent-blue/20 to-accent-purple/20"></div>
                            <div class="diamond-content flex flex-col items-center relative z-10">
                                <span class="text-sm font-bold text-white">X</span>
                            </div>
                        </button>
                        <span class="text-[10px] text-white/70 font-medium">X就业</span>
                    </div>
                </div>
                
                <!-- 中间：4个圆角矩形卡片 -->
                <div class="flex-1 flex flex-col gap-3">
                    <!-- 许愿树 -->
                    <button class="glass-card rounded-2xl p-4 text-left hover-lift glow-border group relative overflow-hidden">
                        <div class="absolute top-0 right-0 w-20 h-20 bg-gradient-to-bl from-yellow-500/10 to-transparent rounded-bl-full"></div>
                        <div class="relative z-10">
                            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-yellow-400/20 to-orange-500/20 flex items-center justify-center mb-3">
                                <svg class="w-5 h-5 text-yellow-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/>
                                </svg>
                            </div>
                            <h3 class="text-base font-semibold text-white mb-1">许愿树</h3>
                            <p class="text-xs text-white/50">写下你的心愿</p>
                        </div>
                    </button>
                    
                    <!-- AI简历问诊 -->
                    <button class="glass-card rounded-2xl p-4 text-left hover-lift glow-border group relative overflow-hidden">
                        <div class="absolute top-0 right-0 w-20 h-20 bg-gradient-to-bl from-accent-cyan/10 to-transparent rounded-bl-full"></div>
                        <div class="relative z-10">
                            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-accent-cyan/20 to-blue-500/20 flex items-center justify-center mb-3">
                                <svg class="w-5 h-5 text-accent-cyan" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                                </svg>
                            </div>
                            <h3 class="text-base font-semibold text-white mb-1">AI简历问诊</h3>
                            <p class="text-xs text-white/50">智能诊断优化</p>
                        </div>
                    </button>
                    
                    <!-- AI读岗 -->
                    <button class="glass-card rounded-2xl p-4 text-left hover-lift glow-border group relative overflow-hidden">
                        <div class="absolute top-0 right-0 w-20 h-20 bg-gradient-to-bl from-accent-purple/10 to-transparent rounded-bl-full"></div>
                        <div class="relative z-10">
                            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-accent-purple/20 to-pink-500/20 flex items-center justify-center mb-3">
                                <svg class="w-5 h-5 text-accent-purple" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7"/>
                                </svg>
                            </div>
                            <h3 class="text-base font-semibold text-white mb-1">AI读岗</h3>
                            <p class="text-xs text-white/50">智能岗位解读</p>
                        </div>
                    </button>
                    
                    <!-- AI精修 -->
                    <button class="glass-card rounded-2xl p-4 text-left hover-lift glow-border group relative overflow-hidden">
                        <div class="absolute top-0 right-0 w-20 h-20 bg-gradient-to-bl from-green-500/10 to-transparent rounded-bl-full"></div>
                        <div class="relative z-10">
                            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-green-400/20 to-emerald-500/20 flex items-center justify-center mb-3">
                                <svg class="w-5 h-5 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                                </svg>
                            </div>
                            <h3 class="text-base font-semibold text-white mb-1">AI精修</h3>
                            <p class="text-xs text-white/50">简历智能精修</p>
                        </div>
                    </button>
                </div>
                
                <!-- 右侧：菱形按钮 -->
                <div class="w-[70px] flex flex-col items-center gap-3 py-2">
                    <!-- 猎头 -->
                    <div class="flex flex-col items-center gap-1.5">
                        <button class="diamond-btn w-14 h-14 glass-card rounded-xl flex items-center justify-center glow-border hover-lift">
                            <div class="diamond-content flex flex-col items-center">
                                <svg class="w-5 h-5 text-white/90" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
                                </svg>
                            </div>
                        </button>
                        <span class="text-[10px] text-white/70 font-medium">猎头</span>
                    </div>
                    
                    <!-- 背调 -->
                    <div class="flex flex-col items-center gap-1.5">
                        <button class="diamond-btn w-14 h-14 glass-card rounded-xl flex items-center justify-center glow-border hover-lift">
                            <div class="diamond-content flex flex-col items-center">
                                <svg class="w-5 h-5 text-white/90" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
                                </svg>
                            </div>
                        </button>
                        <span class="text-[10px] text-white/70 font-medium">背调</span>
                    </div>
                    
                    <!-- 测评 -->
                    <div class="flex flex-col items-center gap-1.5">
                        <button class="diamond-btn w-14 h-14 glass-card rounded-xl flex items-center justify-center glow-border hover-lift">
                            <div class="diamond-content flex flex-col items-center">
                                <svg class="w-5 h-5 text-white/90" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
                                </svg>
                            </div>
                        </button>
                        <span class="text-[10px] text-white/70 font-medium">测评</span>
                    </div>
                    
                    <!-- 委托招聘 -->
                    <div class="flex flex-col items-center gap-1.5">
                        <button class="diamond-btn w-14 h-14 glass-card rounded-xl flex items-center justify-center glow-border hover-lift relative overflow-hidden">
                            <div class="absolute inset-0 bg-gradient-to-br from-accent-purple/20 to-accent-blue/20"></div>
                            <div class="diamond-content flex flex-col items-center relative z-10">
                                <svg class="w-5 h-5 text-white/90" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/>
                                </svg>
                            </div>
                        </button>
                        <span class="text-[10px] text-white/70 font-medium">委托招聘</span>
                    </div>
                </div>
                
            </div>
        </main>
        
        <!-- 底部安全区域 -->
        <div class="h-8 safe-bottom"></div>
        
    </div>
    
</body>
</html>
