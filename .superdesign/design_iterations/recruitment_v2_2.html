    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        
        /* 深色渐变背景 */
        .dark-gradient {
            background: linear-gradient(180deg, #0a0a0f 0%, #050505 100%);
        }
        
        /* 网格背景 */
        .grid-bg {
            background-image: 
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        
        /* 发光网格点 */
        .glow-dots {
            background-image: radial-gradient(rgba(168, 85, 247, 0.08) 1px, transparent 1px);
            background-size: 24px 24px;
        }
        
        /* 玻璃拟态 - 标准 */
        .glass {
            background: rgba(26, 26, 37, 0.6);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        
        /* 玻璃拟态 - 轻 */
        .glass-light {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px) saturate(160%);
            -webkit-backdrop-filter: blur(20px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        
        /* 玻璃拟态 - 卡片 */
        .glass-card {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.06) 0%, rgba(255, 255, 255, 0.02) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 
                0 4px 24px rgba(0, 0, 0, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }
        
        /* 霓虹发光边框 */
        .glow-border-purple {
            box-shadow: 
                0 0 0 1px rgba(168, 85, 247, 0.2),
                0 0 20px rgba(168, 85, 247, 0.1);
        }
        
        .glow-border-cyan {
            box-shadow: 
                0 0 0 1px rgba(6, 182, 212, 0.2),
                0 0 20px rgba(6, 182, 212, 0.1);
        }
        
        .glow-border-pink {
            box-shadow: 
                0 0 0 1px rgba(236, 72, 153, 0.2),
                0 0 20px rgba(236, 72, 153, 0.1);
        }
        
        /* 悬停发光效果 */
        .hover-glow {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .hover-glow:hover {
            transform: translateY(-2px);
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.4),
                0 0 40px rgba(168, 85, 247, 0.15);
            border-color: rgba(168, 85, 247, 0.3);
        }
        
        /* 霓虹文字渐变 */
        .neon-text {
            background: linear-gradient(135deg, #a855f7 0%, #06b6d4 50%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        /* 标签激活状态 */
        .tab-active {
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.9) 0%, rgba(236, 72, 153, 0.9) 100%);
            box-shadow: 0 4px 20px rgba(168, 85, 247, 0.4);
        }
        
        /* 导航项激活 */
        .nav-active {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        
        /* 分类标签 */
        .category-pill {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s ease;
        }
        
        .category-pill:hover {
            background: rgba(168, 85, 247, 0.1);
            border-color: rgba(168, 85, 247, 0.3);
        }
        
        .category-pill.active {
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.2) 0%, rgba(6, 182, 212, 0.2) 100%);
            border-color: rgba(168, 85, 247, 0.4);
        }
        
        /* AI功能卡片渐变 */
        .ai-card-1 {
            background: linear-gradient(145deg, rgba(168, 85, 247, 0.1) 0%, rgba(26, 26, 37, 0.6) 100%);
        }
        
        .ai-card-2 {
            background: linear-gradient(145deg, rgba(6, 182, 212, 0.1) 0%, rgba(26, 26, 37, 0.6) 100%);
        }
        
        .ai-card-3 {
            background: linear-gradient(145deg, rgba(236, 72, 153, 0.1) 0%, rgba(26, 26, 37, 0.6) 100%);
        }
        
        .ai-card-4 {
            background: linear-gradient(145deg, rgba(59, 130, 246, 0.1) 0%, rgba(26, 26, 37, 0.6) 100%);
        }
        
        /* 服务卡片 */
        .service-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.3s ease;
        }
        
        .service-card:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(6, 182, 212, 0.3);
        }
        
        /* 呼吸动画 */
        @keyframes breathe {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.8; }
        }
        
        .animate-breathe {
            animation: breathe 3s ease-in-out infinite;
        }
        
        /* 漂浮动画 */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-4px); }
        }
        
        .animate-float {
            animation: float 4s ease-in-out infinite;
        }
        
        /* 光晕脉冲 */
        @keyframes pulse-glow {
            0%, 100% { 
                box-shadow: 0 0 20px rgba(168, 85, 247, 0.2);
            }
            50% { 
                box-shadow: 0 0 40px rgba(168, 85, 247, 0.4);
            }
        }
        
        .pulse-glow {
            animation: pulse-glow 2s ease-in-out infinite;
        }
        
        /* 隐藏滚动条 */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        /* 渐变光效背景 */
        .ambient-glow {
            position: fixed;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.15;
            pointer-events: none;
        }
        
        .glow-1 {
            background: linear-gradient(135deg, #a855f7, #ec4899);
            top: -100px;
            right: -50px;
        }
        
        .glow-2 {
            background: linear-gradient(135deg, #06b6d4, #3b82f6);
            bottom: 20%;
            left: -100px;
        }
        
        .glow-3 {
            background: linear-gradient(135deg, #ec4899, #a855f7);
            bottom: -50px;
            right: 20%;
        }
    </style>
</head>
