<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hi就业 - 招聘App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* iOS System Font Stack */
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 50%, #d1d5db 100%);
      min-height: 100vh;
    }

    /* Glassmorphism Effect */
    .glass {
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    .glass-dark {
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Diamond Shape */
    .diamond {
      transform: rotate(45deg);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .diamond:hover {
      transform: rotate(45deg) scale(1.08);
    }

    .diamond-content {
      transform: rotate(-45deg);
    }

    /* 3D Floating Card */
    .float-card {
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 
        0 4px 6px -1px rgba(0, 0, 0, 0.05),
        0 10px 20px -5px rgba(0, 0, 0, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.6);
    }

    .float-card:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 
        0 12px 24px -8px rgba(0, 0, 0, 0.12),
        0 20px 40px -12px rgba(0, 0, 0, 0.15),
        inset 0 1px 0 rgba(255, 255, 255, 0.8);
    }

    /* Neon Glow */
    .neon-cyan {
      box-shadow: 0 0 20px rgba(34, 211, 238, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.4);
    }

    .neon-purple {
      box-shadow: 0 0 20px rgba(167, 139, 250, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.4);
    }

    /* Capsule Tab */
    .capsule-tab {
      transition: all 0.3s ease;
    }

    .capsule-tab.active {
      background: linear-gradient(135deg, #22d3ee 0%, #a78bfa 100%);
      color: white;
      box-shadow: 0 4px 15px rgba(34, 211, 238, 0.35);
    }

    /* Top Tab */
    .top-tab {
      position: relative;
      transition: all 0.3s ease;
    }

    .top-tab.active::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 50%;
      transform: translateX(-50%);
      width: 20px;
      height: 3px;
      background: linear-gradient(90deg, #22d3ee, #a78bfa);
      border-radius: 2px;
    }

    /* iOS Safe Area */
    .ios-container {
      max-width: 480px;
      margin: 0 auto;
      padding: 48px 16px 32px;
    }

    /* Scrollbar Hide */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Gradient Text */
    .gradient-text {
      background: linear-gradient(135deg, #0891b2 0%, #7c3aed 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Subtle Animation */
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .animate-float {
      animation: float 4s ease-in-out infinite;
    }

    .animate-float-delay {
      animation: float 4s ease-in-out infinite;
      animation-delay: 1s;
    }

    /* Icon Backgrounds */
    .icon-bg {
      background: linear-gradient(135deg, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0.6) 100%);
    }
  </style>
</head>
<body class="antialiased">
  <div class="ios-container">
    <!-- Header Area -->
    <header class="glass rounded-3xl px-6 py-4 mb-6 flex justify-between items-center">
      <!-- Brand Title -->
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-cyan-400 to-purple-500 flex items-center justify-center">
          <span class="text-white font-bold text-lg">H</span>
        </div>
        <h1 class="text-xl font-bold text-gray-900 tracking-tight">Hi就业</h1>
      </div>
      
      <!-- Top Tabs -->
      <div class="flex items-center gap-6">
        <button class="top-tab active text-sm font-semibold text-gray-900 pb-1">招聘</button>
        <button class="top-tab text-sm font-medium text-gray-500 pb-1">用工</button>
      </div>
    </header>

    <!-- Horizontal Navigation Capsule -->
    <nav class="glass rounded-full px-2 py-2 mb-8 flex justify-between items-center overflow-x-auto no-scrollbar">
      <button class="capsule-tab active px-4 py-2 rounded-full text-xs font-semibold whitespace-nowrap">招聘</button>
      <button class="capsule-tab px-4 py-2 rounded-full text-xs font-medium text-gray-600 whitespace-nowrap hover:text-gray-900">考试</button>
      <button class="capsule-tab px-4 py-2 rounded-full text-xs font-medium text-gray-600 whitespace-nowrap hover:text-gray-900">猎头</button>
      <button class="capsule-tab px-4 py-2 rounded-full text-xs font-medium text-gray-600 whitespace-nowrap hover:text-gray-900">背调</button>
      <button class="capsule-tab px-4 py-2 rounded-full text-xs font-medium text-gray-600 whitespace-nowrap hover:text-gray-900">测评</button>
    </nav>

    <!-- Main Three Column Layout -->
    <main class="grid grid-cols-12 gap-3 items-start">
      <!-- Left Column: Diamond Buttons -->
      <div class="col-span-3 flex flex-col items-center gap-4 pt-4">
        <!-- Social Recruitment -->
        <div class="diamond w-16 h-16 glass neon-cyan rounded-2xl flex items-center justify-center cursor-pointer animate-float">
          <div class="diamond-content flex flex-col items-center">
            <svg class="w-5 h-5 text-cyan-600 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
            </svg>
          </div>
        </div>
        <span class="text-[10px] font-medium text-gray-700 text-center leading-tight mt-1">社会招聘</span>

        <!-- City Campus -->
        <div class="diamond w-16 h-16 glass rounded-2xl flex items-center justify-center cursor-pointer animate-float-delay mt-2">
          <div class="diamond-content flex flex-col items-center">
            <svg class="w-5 h-5 text-purple-600 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
            </svg>
          </div>
        </div>
        <span class="text-[10px] font-medium text-gray-700 text-center leading-tight mt-1">本市校招</span>

        <!-- Province Campus -->
        <div class="diamond w-16 h-16 glass rounded-2xl flex items-center justify-center cursor-pointer animate-float mt-2">
          <div class="diamond-content flex flex-col items-center">
            <svg class="w-5 h-5 text-cyan-600 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
          </div>
        </div>
        <span class="text-[10px] font-medium text-gray-700 text-center leading-tight mt-1">省内校招</span>

        <!-- X Employment -->
        <div class="diamond w-16 h-16 glass rounded-2xl flex items-center justify-center cursor-pointer animate-float-delay mt-2">
          <div class="diamond-content flex flex-col items-center">
            <span class="text-lg font-bold gradient-text">X</span>
          </div>
        </div>
        <span class="text-[10px] font-medium text-gray-700 text-center leading-tight mt-1">X就业</span>
      </div>

      <!-- Middle Column: Rounded Cards -->
      <div class="col-span-6 flex flex-col gap-4">
        <!-- Wish Tree Card -->
        <div class="float-card glass rounded-3xl p-5 relative overflow-hidden">
          <div class="absolute top-0 right-0 w-24 h-24 bg-gradient-to-br from-cyan-200/30 to-purple-200/30 rounded-full blur-2xl -translate-y-1/2 translate-x-1/2"></div>
          <div class="relative flex items-center gap-4">
            <div class="icon-bg w-12 h-12 rounded-2xl flex items-center justify-center">
              <svg class="w-6 h-6 text-cyan-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path>
              </svg>
            </div>
            <div>
              <h3 class="text-base font-bold text-gray-900">许愿树</h3>
              <p class="text-xs text-gray-500 mt-0.5">许下职业心愿</p>
            </div>
          </div>
        </div>

        <!-- AI Resume Clinic -->
        <div class="float-card glass rounded-3xl p-5 relative overflow-hidden">
          <div class="absolute top-0 right-0 w-24 h-24 bg-gradient-to-br from-purple-200/30 to-pink-200/30 rounded-full blur-2xl -translate-y-1/2 translate-x-1/2"></div>
          <div class="relative flex items-center gap-4">
            <div class="icon-bg w-12 h-12 rounded-2xl flex items-center justify-center">
              <svg class="w-6 h-6 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
              </svg>
            </div>
            <div>
              <h3 class="text-base font-bold text-gray-900">AI简历问诊</h3>
              <p class="text-xs text-gray-500 mt-0.5">智能优化建议</p>
            </div>
          </div>
        </div>

        <!-- AI Job Reader -->
        <div class="float-card glass rounded-3xl p-5 relative overflow-hidden">
          <div class="absolute top-0 right-0 w-24 h-24 bg-gradient-to-br from-cyan-200/30 to-blue-200/30 rounded-full blur-2xl -translate-y-1/2 translate-x-1/2"></div>
          <div class="relative flex items-center gap-4">
            <div class="icon-bg w-12 h-12 rounded-2xl flex items-center justify-center">
              <svg class="w-6 h-6 text-cyan-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
              </svg>
            </div>
            <div>
              <h3 class="text-base font-bold text-gray-900">AI读岗</h3>
              <p class="text-xs text-gray-500 mt-0.5">智能岗位解读</p>
            </div>
          </div>
        </div>

        <!-- AI Polish -->
        <div class="float-card glass rounded-3xl p-5 relative overflow-hidden">
          <div class="absolute top-0 right-0 w-24 h-24 bg-gradient-to-br from-purple-200/30 to-cyan-200/30 rounded-full blur-2xl -translate-y-1/2 translate-x-1/2"></div>
          <div class="relative flex items-center gap-4">
            <div class="icon-bg w-12 h-12 rounded-2xl flex items-center justify-center">
              <svg class="w-6 h-6 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
              </svg>
            </div>
            <div>
              <h3 class="text-base font-bold text-gray-900">AI精修</h3>
              <p class="text-xs text-gray-500 mt-0.5">简历智能润色</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Right Column: Diamond Buttons -->
      <div class="col-span-3 flex flex-col items-center gap-4 pt-4">
        <!-- Headhunting -->
        <div class="diamond w-16 h-16 glass neon-purple rounded-2xl flex items-center justify-center cursor-pointer animate-float-delay">
          <div class="diamond-content flex flex-col items-center">
            <svg class="w-5 h-5 text-purple-600 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
          </div>
        </div>
        <span class="text-[10px] font-medium text-gray-700 text-center leading-tight mt-1">猎头</span>

        <!-- Background Check -->
        <div class="diamond w-16 h-16 glass rounded-2xl flex items-center justify-center cursor-pointer animate-float mt-2">
          <div class="diamond-content flex flex-col items-center">
            <svg class="w-5 h-5 text-cyan-600 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
            </svg>
          </div>
        </div>
        <span class="text-[10px] font-medium text-gray-700 text-center leading-tight mt-1">背调</span>

        <!-- Assessment -->
        <div class="diamond w-16 h-16 glass rounded-2xl flex items-center justify-center cursor-pointer animate-float-delay mt-2">
          <div class="diamond-content flex flex-col items-center">
            <svg class="w-5 h-5 text-purple-600 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path>
            </svg>
          </div>
        </div>
        <span class="text-[10px] font-medium text-gray-700 text-center leading-tight mt-1">测评</span>

        <!-- Entrusted Recruitment -->
        <div class="diamond w-16 h-16 glass rounded-2xl flex items-center justify-center cursor-pointer animate-float mt-2">
          <div class="diamond-content flex flex-col items-center">
            <svg class="w-5 h-5 text-cyan-600 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path>
            </svg>
          </div>
        </div>
        <span class="text-[10px] font-medium text-gray-700 text-center leading-tight mt-1">委托招聘</span>
      </div>
    </main>

    <!-- Bottom Navigation (iOS Style Tab Bar) -->
    <nav class="glass rounded-3xl mt-8 px-6 py-3 flex justify-around items-center">
      <button class="flex flex-col items-center gap-1">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-cyan-400 to-purple-500 flex items-center justify-center">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
          </svg>
        </div>
        <span class="text-[10px] font-medium text-gray-900">首页</span>
      </button>
      <button class="flex flex-col items-center gap-1 opacity-50">
        <div class="w-10 h-10 rounded-xl flex items-center justify-center">
          <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
        </div>
        <span class="text-[10px] font-medium text-gray-600">搜索</span>
      </button>
      <button class="flex flex-col items-center gap-1 opacity-50">
        <div class="w-10 h-10 rounded-xl flex items-center justify-center">
          <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
          </svg>
        </div>
        <span class="text-[10px] font-medium text-gray-600">我的</span>
      </button>
    </nav>
  </div>
</body>
</html>
