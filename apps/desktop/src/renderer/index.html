<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'"> 
    <title>AI Browser</title>
    <style>
      body { margin:0; font-family:system-ui, sans-serif; }
      .layout { display:flex; height:100vh; }
      .main { flex:1; display:flex; align-items:center; justify-content:center; }
      .sidebar { width:360px; border-left:1px solid #ddd; padding:12px; overflow:auto; }
      .input { width:60%; display:flex; gap:8px; }
      textarea { flex:1; height:120px; }
      button { padding:8px 12px; }
      .msg { margin:8px 0; }
      .user { text-align:right; }
      .assistant { text-align:left; }
      .selected { outline: 1px solid #4a90e2; }
      .pinned { background: #fff5cc; }
      .error { color: #c00; }
      .session-item { display:flex; justify-content: space-between; align-items:center; padding:4px 0; }
      .session-star { color: #e6b800; }
      #context-menu { position:absolute; display:none; background:#fff; border:1px solid #ddd; box-shadow:0 2px 8px rgba(0,0,0,0.15); z-index:1000; }
      #context-menu button { display:block; width:100%; padding:6px 10px; text-align:left; border:none; background:none; cursor:pointer; }
      #toast { position: fixed; bottom: 16px; left: 16px; background: #333; color: #fff; padding: 8px 12px; border-radius: 4px; display:none; }
      pre { background:#f6f8fa; padding:8px; border-radius:4px; overflow:auto; }
      code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
      .copy-btn { font-size:12px; }
    </style>
  </head>
  <body>
    <div class="layout">
      <div class="main">
        <div class="input">
          <textarea id="chat-input" placeholder="输入内容..."></textarea>
          <button id="submit">确定</button>
          <button id="stop">停止</button>
          <button id="resume">继续</button>
        </div>
      </div>
      <div class="sidebar">
        <div>
          <div id="update-banner" style="display:none; background:#fffae6; border:1px solid #eed; padding:8px; margin-bottom:8px;">
            有可用更新
            <button id="install-update">安装更新</button>
          </div>
          <details style="margin-bottom:8px;">
            <summary>设置</summary>
            <div style="margin-top:8px; display:flex; gap:8px; align-items:center;">
              <label for="openai-key">OpenAI API Key</label>
              <input id="openai-key" type="password" placeholder="sk-..." />
              <button id="save-settings">保存</button>
            </div>
            <div style="margin-top:8px;">
              <div>模型顺序（从左到右优先级）：</div>
              <div id="order-list" style="display:flex; gap:8px; align-items:center;">
                <div class="prov" draggable="true" data-name="openai" style="padding:4px 8px; border:1px solid #ddd; border-radius:4px;">OpenAI</div>
                <div class="prov" draggable="true" data-name="ollama" style="padding:4px 8px; border:1px solid #ddd; border-radius:4px;">Ollama</div>
                <div class="prov" draggable="true" data-name="anthropic" style="padding:4px 8px; border:1px solid #ddd; border-radius:4px;">Anthropic</div>
                <div class="prov" draggable="true" data-name="gemini" style="padding:4px 8px; border:1px solid #ddd; border-radius:4px;">Gemini</div>
              </div>
              <div style="margin-top:8px; display:flex; gap:8px; align-items:center;">
                <label><input type="checkbox" id="order-openai" checked /> 启用 OpenAI</label>
                <label><input type="checkbox" id="order-ollama" checked /> 启用 Ollama</label>
                <label><input type="checkbox" id="order-anthropic" /> 启用 Anthropic</label>
                <label><input type="checkbox" id="order-gemini" /> 启用 Gemini</label>
                <button id="save-order">保存顺序</button>
              </div>
            </div>
          </details>
          <button id="new-session">新会话</button>
          <div style="display:flex; gap:8px; align-items:center;">
            <input id="search" placeholder="搜索..." />
            <label><input type="checkbox" id="global-search" /> 全局搜索</label>
          </div>
          <div style="margin:8px 0; display:flex; gap:8px;">
            <button id="copy">复制</button>
            <button id="pin">固定</button>
            <button id="delete">删除</button>
            <button id="export">导出</button>
            <button id="retry-msg">重试消息</button>
          </div>
          <div id="sessions"></div>
          <div style="display:flex; gap:8px; margin-top:8px;">
            <button id="rename-session">重命名会话</button>
            <button id="delete-session">删除会话</button>
            <button id="pin-session">固定会话</button>
          </div>
        </div>
        <div id="history"></div>
      </div>
    </div>
    <script src="./main.js"></script>
    <div id="toast"></div>
    <div id="context-menu">
      <button id="cm-copy">复制</button>
      <button id="cm-pin">固定/取消固定</button>
      <button id="cm-delete">删除</button>
      <button id="cm-retry">重试此消息</button>
    </div>
  </body>
  </html>
